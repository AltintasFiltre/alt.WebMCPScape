version: '3.8'

services:
  alt-cross-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    image: alt-cross-scraper:latest
    container_name: alt-cross-scraper-container
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=production
      - PORT=4002
    volumes:
      - alt_cross_scraper_data:/app/data

volumes:
  alt_cross_scraper_data:
    name: alt_cross_scraper_data
